# Robolectric 4.17 cannot instrument java.io.FileDescriptor on JDK 21 or newer, which is
# what the Gradle daemon runs here (see gradle/gradle-daemon-jvm.properties). The host
# test launcher is therefore pinned to JDK 17, and the emulated SDK has to be one that
# runs on 17: SDK 36 refuses anything older than 21, while SDK 34 is fine.
sdk=34
