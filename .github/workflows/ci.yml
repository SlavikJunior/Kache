name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM + Android host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        # Gradle's daemon-JVM criteria in gradle/gradle-daemon-jvm.properties already
        # provision a matching JDK through foojay, so only Gradle itself is set up here.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is the legacy `tools` package, which Google has removed from
          # the SDK repository. Relying on that default makes every run fail during setup,
          # before a single line of the project is compiled.
          packages: 'platform-tools'

      # compileSdk 36 for the library modules and 37.0 for the Compose sample.
      #
      # Android 37 is a minor-versioned platform: the SDK manager publishes it as
      # `platforms;android-37.0` and `platforms;android-37.1`, and there is no plain
      # `platforms;android-37` to ask for. Naming the major version only fails here, with a
      # "Failed to find package" that looks like an outage rather than a typo.
      - name: Install Android platforms
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test JVM, Android host and iOS-simulator sources
        run: ./gradlew check

      - name: Verify binary compatibility
        run: ./gradlew apiCheck

      # The test counts in README and docs/BACKLOG.md were three different numbers at one
      # point. `check` has just produced the XML this reads, so a drift fails the build here
      # instead of waiting for someone to notice it in prose.
      - name: Verify documented test counts
        run: ./gradlew verifyDocCounts

      # The sample is an app on three platforms: the Android entry point is built and
      # linted here, and the desktop (JVM) target is compiled so the shared code is proven
      # to build for a second JVM target as well.
      - name: Build and lint the Android sample
        run: ./gradlew :sample-android:assembleDebug :sample-android:lintDebug :sample:desktopJar

  ios:
    name: iOS compile, link and simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # `check` alone does not prove the iOS artifacts link: iosX64Test is disabled on
      # Apple Silicon and iosArm64Test needs a physical device. Compilation and linking
      # are therefore verified explicitly, and the simulator suite is run on its own.
      - name: Compile every iOS target
        run: |
          ./gradlew \
            :cache-core:compileKotlinIosArm64 \
            :cache-core:compileKotlinIosSimulatorArm64 \
            :cache-core:compileKotlinIosX64 \
            :cache-store-room:compileKotlinIosArm64 \
            :cache-store-room:compileKotlinIosSimulatorArm64 \
            :cache-storage:compileKotlinIosArm64 \
            :cache-storage:compileKotlinIosSimulatorArm64 \
            :sample:compileKotlinIosArm64 \
            :sample:compileKotlinIosSimulatorArm64

      - name: Link every iOS target
        run: |
          ./gradlew \
            :cache-core:iosArm64MainBinaries \
            :cache-core:iosSimulatorArm64MainBinaries \
            :cache-core:iosX64MainBinaries \
            :cache-store-room:iosArm64MainBinaries \
            :cache-store-room:iosSimulatorArm64MainBinaries \
            :cache-storage:iosArm64MainBinaries \
            :cache-storage:iosSimulatorArm64MainBinaries \
            :sample:linkDebugFrameworkIosArm64 \
            :sample:linkDebugFrameworkIosSimulatorArm64

      - name: Run iOS simulator tests
        run: |
          ./gradlew \
            :cache-core:iosSimulatorArm64Test \
            :cache-storage:iosSimulatorArm64Test \
            :cache-store-room:iosSimulatorArm64Test \
            :sample:iosSimulatorArm64Test

      - name: Verify binary compatibility
        run: ./gradlew apiCheck

  publication:
    name: Publish and consume the artifacts
    # Runs on macOS because KMP iOS publications cannot be produced on Linux, and the
    # goal here is to prove that *every* publication still builds and carries its
    # javadoc and sources artifacts.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Dry run: everything lands in build/repo, nothing leaves the machine.
      - name: Publish
        run: ./gradlew publishAllPublicationsToLocalRepository

      # Resolving the artifacts as an external dependency is a different check from building
      # them: a wrong coordinate, a POM missing a required field or a missing sources/javadoc
      # artifact all pass publication and fail only here. The harness lives in its own Gradle
      # build and reaches the sources not at all, which is the whole point.
      - name: Consume the artifacts as an external dependency
        working-directory: verification/consumer
        run: ./gradlew run --console=plain

  instrumented:
    name: Instrumented Room tests on an emulator
    # The emulator job exists because `BundledSQLiteDriver` ships JNI built for Android ABIs
    # and cannot be loaded in a host JVM test. The real driver and `createFromContext` are
    # therefore covered only here; without this job they are covered by nobody.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platforms
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      # The emulator needs read/write access to /dev/kvm. A udev rule works mid-job, while
      # adding the user to the kvm group does not: group membership is read at login.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A dropped adb connection surfaces as a hung task with an empty failure rather than as
      # an assertion, so the step carries its own budget as well as the job's.
      - name: Run the instrumented Room suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :cache-store-room:connectedAndroidDeviceTest