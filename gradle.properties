org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Dokka V2 migration
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Compose Hot Reload needs the JetBrains Runtime: a stock JDK can only redefine
# method bodies, while JBR accepts structural changes. The plugin asks a Gradle
# toolchain for one; without a resolver that request fails on a machine that has
# only Temurin/Corretto installed, and `hotRunDesktop` stops before the window
# opens. Letting the plugin download its own JBR keeps the requirement out of
# every developer's system setup, and it affects the hot tasks only — `check`,
# publication and CI never resolve it. The property is the feature's own switch,
# so it is documented as experimental upstream.
compose.reload.jbr.autoProvisioningEnabled=true

# Project metadata for Maven publishing
# Central rejected `com.github.*` for new namespaces (changelog 2021-04-01) and
# directs personal projects to `io.github.<user>`. The Kotlin packages and the
# Android namespaces follow the groupId, so all three agree.
GROUP=io.github.slavikjunior.kache

# Signing keys (optional): generate with `gpg --full-generate-key`, then
# export SIGNING_KEY=$(gpg --armor --export-secret-keys KEY_ID)
# export SIGNING_PASSWORD=<passphrase>
# or set them in gradle.properties:
# SIGNING_KEY=...
# SIGNING_PASSWORD=...
# VERSION_NAME must not end with SNAPSHOT for Central publishing.
VERSION_NAME=1.0.0

POM_DESCRIPTION=Enterprise-grade Kotlin Multiplatform caching library with L1/L2 tiers and reactive strategy pipeline
POM_URL=https://github.com/SlavikJunior/Kache
POM_SCM_URL=https://github.com/SlavikJunior/Kache
POM_SCM_CONNECTION=scm:git:https://github.com/SlavikJunior/Kache.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/SlavikJunior/Kache.git

POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=slavikjunior
POM_DEVELOPER_NAME=Vyacheslav
