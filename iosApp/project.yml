# Xcode-проект для iOS-приложения. Генерируется xcodegen, а не хранится в git:
#   cd iosApp && xcodegen generate
#
# Так единственным источником правды остаётся этот файл, и правка настроек не требует
# ручного редактирования pbxproj. Если xcodegen не установлен: `brew install xcodegen`.
name: iosApp

options:
  bundleIdPrefix: io.github.slavikjunior.kache
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Путь, куда Gradle складывает собранный фреймворк; конкретный каталог зависит от
    # конфигурации и SDK, поэтому в пути стоят переменные Xcode.
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../sample/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Sample"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.slavikjunior.kache.sample
        PRODUCT_NAME: KacheSample
        SWIFT_VERSION: "5.9"
        # Скрипт сборки обращается к Gradle вне песочницы: иначе запуск gradlew из
        # build phase запрещён.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Сборка под симулятор не требует подписи; для устройства подпись задаётся в Xcode.
        CODE_SIGNING_ALLOWED: NO
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Kache sample
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Compose Multiplatform проверяет этот ключ при старте и падает, если его нет:
        # без него iOS ограничивает кадры до 60 Гц на ProMotion-экранах.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # IDE может собирать Kotlin сам; тогда повторный запуск Gradle не нужен.
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode
